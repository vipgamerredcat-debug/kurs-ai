name: Deploy English Center to GitHub Pages
on:
  push:
    paths:
      - "english-center/**"
      - ".github/workflows/english-center-pages.yml"
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-english-center"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: english-center
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
