<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><title>English Center</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#080f1d;--panel:#111e32;--panel2:#182a43;--line:#2b4563;--txt:#edf6ff;--muted:#a2b5cd;--cyan:#50dce8;--green:#71edb5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#183955 0,transparent 42%),radial-gradient(ellipse at 90% 90%,#123b3a 0,transparent 35%),var(--bg);color:var(--txt);font:15px/1.5 Segoe UI,Arial,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(480px,100%);padding:34px;background:#0e1a2ded;border:1px solid var(--line);border-radius:24px;text-align:center;box-shadow:0 25px 90px #0009}.logo{width:68px;height:68px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--green));color:#07121b;font-size:27px;font-weight:900}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:1.7px}h1{font-size:32px;margin:7px 0}.muted{color:var(--muted)}.google{display:flex;justify-content:center;margin:24px auto 10px;min-height:44px}.demo,.btn{border:0;border-radius:11px;padding:11px 16px;background:linear-gradient(100deg,var(--cyan),var(--green));color:#06151c;font-weight:800}.demo{background:#1c3551;color:var(--txt);border:1px solid #385675;margin-top:10px}.fine{font-size:12px;color:#91a7c0;margin-top:20px}.top{height:68px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;background:#091524eF;border-bottom:1px solid var(--line);position:sticky;top:0}.brand{font-weight:900;letter-spacing:1px}.brand b{color:var(--cyan)}.user{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#28425e}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 68px)}aside{padding:20px 13px;border-right:1px solid var(--line)}.nav{display:block;width:100%;text-align:left;border:0;border-radius:11px;background:transparent;color:#aec0d6;padding:12px;margin:3px 0}.nav:hover,.nav.active{background:#1a3450;color:white}main{padding:28px;max-width:1250px;width:100%;margin:auto}.welcome{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.welcome h2{font-size:28px;margin:4px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.panel{padding:19px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#152740,#0f1a2b)}.hero{grid-column:span 2;background:linear-gradient(110deg,#124052,#1b2b4c);min-height:180px}.hero h3{font-size:23px;margin:9px 0}.stat strong{font-size:27px}.tile{min-height:145px;cursor:pointer;transition:.18s}.tile:hover{transform:translateY(-3px);border-color:var(--cyan)}.emoji{font-size:28px;margin-bottom:9px}.tile h3{margin:0 0 4px}.tile p{color:var(--muted);font-size:13px;margin:0}.section{max-width:760px;margin:auto}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.answer{background:#192e49;color:white;border:1px solid #36516f;border-radius:11px;padding:13px;text-align:left}.answer:hover{border-color:var(--cyan)}.answer:disabled{opacity:.8}.word{font-size:32px;color:var(--cyan);font-weight:900;margin:16px 0}.feedback{min-height:28px;color:var(--green);font-weight:700}.progress{height:8px;background:#263b54;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;padding:7px;border-right:0;border-bottom:1px solid var(--line)}.nav{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr 1fr}.hero{grid-column:span 2}}@media(max-width:540px){main{padding:17px}.grid{grid-template-columns:1fr}.hero{grid-column:span 1}.welcome{display:block}.answers{grid-template-columns:1fr}.card{padding:25px 18px}.user #userName{display:none}}
</style></head><body>
<section id="login" class="login"><div class="card"><div class="logo">EC</div><div class="eyebrow">YOUR ENGLISH LEARNING SPACE</div><h1>English Center</h1><p class="muted">Zaloguj się przez Google albo uruchom wersję demonstracyjną.</p><div id="googleArea" class="google"></div><button class="demo" onclick="demoLogin()">Wejdź bez logowania — podgląd</button><p id="loginInfo" class="fine">Logowanie Google wymaga wstawienia identyfikatora OAuth z Google Cloud. Nigdy nie wpisuj tutaj hasła Google.</p></div></section>
<div id="app" class="hidden"><header class="top"><div class="brand">ENGLISH <b>CENTER</b></div><div class="user"><img id="avatar" class="avatar" alt=""><span id="userName">Gość</span><button class="demo" onclick="logout()">Wyloguj</button></div></header><div class="layout"><aside><button class="nav active" onclick="page('home',this)">⌂　Pulpit</button><button class="nav" onclick="page('words',this)">📚　Słówka</button><button class="nav" onclick="page('quiz',this)">◈　Quiz</button><button class="nav" onclick="page('sentences',this)">💬　Zdania</button><button class="nav" onclick="page('games',this)">🎮　Gry</button><button class="nav" onclick="page('progress',this)">▥　Postępy</button></aside><main id="main"></main></div></div>
<script>
const GOOGLE_CLIENT_ID="WSTAW_TUTAJ_GOOGLE_CLIENT_ID";
const words=[["apple","jabłko"],["window","okno"],["beautiful","piękny"],["library","biblioteka"],["journey","podróż"],["improve","ulepszać"],["usually","zwykle"],["knowledge","wiedza"]];
const sentences=[["I am learning English.","Uczę się angielskiego."],["Could you help me, please?","Czy możesz mi pomóc, proszę?"],["She is reading a book.","Ona czyta książkę."],["We are going to school.","Idziemy do szkoły."]];
const questions=[["She ___ to school every day.",["go","goes","going"],1,"W Present Simple dla she dodajemy -s."],["Co oznacza usually?",["nigdy","zwykle","rzadko"],1,"Usually oznacza „zwykle”."],["They ___ playing now.",["is","am","are"],2,"Z they używamy are."],["Przeciwieństwo expensive to:",["cheap","easy","strong"],0,"Cheap oznacza „tani”."],["I have lived here ___ 2020.",["for","since","during"],1,"Since wskazuje moment rozpoczęcia."]];
let user={name:"Gość",picture:""},xp=0,done=0,wi=0,qi=0,quizScore=0,gameWord=null;
try{xp=+(localStorage.ec_xp||0);done=+(localStorage.ec_done||0)}catch(e){}
function $(id){return document.getElementById(id)}
function demoLogin(){user={name:"Gość — tryb podglądu",picture:""};enter()}
function enter(){ $("login").classList.add("hidden");$("app").classList.remove("hidden");$("userName").textContent=user.name;$("avatar").src=user.picture||"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#29435e"/><text x="20" y="27" text-anchor="middle" font-size="21" fill="white">G</text></svg>');page("home")}
function handleGoogle(response){try{const p=JSON.parse(atob(response.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));user={name:p.name||"Użytkownik",picture:p.picture||""};enter()}catch(e){$("loginInfo").textContent="Nie udało się odczytać profilu Google. Spróbuj ponownie."}}
window.handleGoogle=handleGoogle;
function initGoogle(){if(GOOGLE_CLIENT_ID==="WSTAW_TUTAJ_GOOGLE_CLIENT_ID"){$("loginInfo").textContent="Google OAuth nie jest jeszcze skonfigurowany. Wersja demonstracyjna działa bez logowania.";return}if(!window.google||!google.accounts){setTimeout(initGoogle,300);return}google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleGoogle});google.accounts.id.renderButton($("googleArea"),{theme:"filled_black",size:"large",shape:"rectangular",text:"signin_with",locale:"pl"})}
window.addEventListener("load",initGoogle);
function logout(){$("app").classList.add("hidden");$("login").classList.remove("hidden")}
function save(){try{localStorage.ec_xp=xp;localStorage.ec_done=done}catch(e){}}
function gain(n){xp+=n;done++;save()}
function page(name,btn){document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");const m=$("main");if(name==="home")m.innerHTML='<div class="welcome"><div><div class="eyebrow">PANEL UCZNIA</div><h2>Witaj w English Center!</h2><p class="muted">Wybierz aplikację i ćwicz angielski każdego dnia.</p></div><button class="btn" onclick="page(\'quiz\')">Rozpocznij quiz →</button></div><div class="grid"><div class="panel hero"><div class="eyebrow">LEARNING OS</div><h3>Angielski. Prościej, ciekawiej, skuteczniej.</h3><p class="muted">Słówka, zdania, quizy i gry w jednym miejscu.</p></div><div class="panel stat"><span class="muted">Punkty</span><br><strong>'+xp+' XP</strong></div><div class="panel stat"><span class="muted">Ćwiczenia</span><br><strong>'+done+'</strong></div><div class="panel tile" onclick="page(\'words\')"><div class="emoji">📚</div><h3>Słówka</h3><p>Ucz się nowych wyrażeń.</p></div><div class="panel tile" onclick="page(\'quiz\')"><div class="emoji">◈</div><h3>Quiz</h3><p>Sprawdź swoją wiedzę.</p></div><div class="panel tile" onclick="page(\'sentences\')"><div class="emoji">💬</div><h3>Zdania</h3><p>Ćwicz przydatne zwroty.</p></div></div>';
if(name==="words"){let w=words[wi%words.length];m.innerHTML='<div class="section"><div class="eyebrow">TRENING SŁOWNICTWA</div><h2>Słówka</h2><div class="panel"><span class="muted">Karta '+(wi+1)+' / '+words.length+'</span><div class="word">'+w[0]+'</div><p>Tłumaczenie: <b>'+w[1]+'</b></p><button class="btn" onclick="gain(5);wi++;page(\'words\')">Znam to · +5 XP</button> <button class="demo" onclick="wi++;page(\'words\')">Następne</button></div></div>'}
if(name==="sentences"){let s=sentences[Math.floor(Math.random()*sentences.length)];m.innerHTML='<div class="section"><div class="eyebrow">PRAKTYCZNY ANGIELSKI</div><h2>Zdania dnia</h2><div class="panel"><div class="word">'+s[0]+'</div><p class="muted">'+s[1]+'</p><button class="btn" onclick="gain(5);page(\'sentences\')">Zapamiętane · +5 XP</button></div></div>'}
if(name==="quiz"){qi=0;quizScore=0;showQuestion()}
if(name==="games"){m.innerHTML='<div class="eyebrow">NAUKA PRZEZ ZABAWĘ</div><h2>Strefa gier</h2><div class="grid"><div class="panel tile" onclick="page(\'words\')"><div class="emoji">🧠</div><h3>Fiszki</h3><p>Zapamiętuj słówka.</p></div><div class="panel tile" onclick="startGame()"><div class="emoji">⚡</div><h3>Word Challenge</h3><p>Wybierz poprawne tłumaczenie.</p></div></div>'}
if(name==="progress"){m.innerHTML='<div class="eyebrow">TWOJE WYNIKI</div><h2>Postępy</h2><div class="grid"><div class="panel"><span class="muted">Punkty</span><div class="word">'+xp+' XP</div></div><div class="panel"><span class="muted">Ćwiczenia</span><div class="word">'+done+'</div></div><div class="panel"><span class="muted">Poziom</span><div class="word">'+(Math.floor(xp/50)+1)+'</div></div><div class="panel" style="grid-column:1/-1"><p>Do następnego poziomu</p><div class="progress"><i style="width:'+(xp%50*2)+'%"></i></div><p class="muted">'+(xp%50)+' / 50 XP</p></div></div>'}}
function showQuestion(){let q=questions[qi];$("main").innerHTML='<div class="section"><div class="eyebrow">QUIZ · PYTANIE '+(qi+1)+' / '+questions.length+'</div><h2>Sprawdź się</h2><div class="panel"><div class="word" style="font-size:24px">'+q[0]+'</div><div class="answers">'+q[1].map((a,i)=>'<button class="answer" onclick="answer('+i+')">'+a+'</button>').join("")+'</div><div id="feedback" class="feedback"></div><button id="next" class="btn hidden" onclick="nextQ()">Dalej →</button></div></div>'}
function answer(i){let q=questions[qi];document.querySelectorAll(".answer").forEach((b,j)=>{b.disabled=true;if(j===q[2])b.style.borderColor="#71edb5"});if(i===q[2])quizScore++;$("feedback").textContent=(i===q[2]?"Dobrze! ":"Poprawna odpowiedź: "+q[1][q[2]]+". ")+q[3];$("next").classList.remove("hidden")}
function nextQ(){qi++;if(qi<questions.length)showQuestion();else{let earned=quizScore*10;gain(earned);$("main").innerHTML='<div class="panel section"><div class="eyebrow">WYNIK TESTU</div><div class="word">'+quizScore+' / '+questions.length+'</div><p>Zdobywasz '+earned+' XP.</p><button class="btn" onclick="page(\'quiz\')">Spróbuj ponownie</button></div>'}}
function startGame(){let w=words[Math.floor(Math.random()*words.length)];let choices=[w[1]];while(choices.length<3){let v=words[Math.floor(Math.random()*words.length)][1];if(!choices.includes(v))choices.push(v)}choices.sort(()=>Math.random()-.5);$("main").innerHTML='<div class="section"><div class="eyebrow">WORD CHALLENGE</div><h2>Wybierz tłumaczenie</h2><div class="panel"><div class="word">'+w[0]+'</div>'+choices.map(c=>'<button class="answer" onclick="gameAnswer(this,\''+c.replace(/'/g,"\\'")+'\',\''+w[1].replace(/'/g,"\\'")+'\')">'+c+'</button>').join("")+'<div id="feedback" class="feedback"></div><button class="btn" onclick="startGame()">Następne słowo</button></div></div>'}
function gameAnswer(el,c,correct){document.querySelectorAll(".answer").forEach(b=>b.disabled=true);if(c===correct){$("feedback").textContent="Świetnie! +10 XP";gain(10);el.style.borderColor="#71edb5"}else{$("feedback").textContent="Poprawna odpowiedź: "+correct}}
</script></body></html>
